# When a release is published, checks its map the way the game does and opens a
# pull request adding it to basemaps.json. Players are offered the map only once
# a maintainer merges that pull request. Run it by hand (Actions → Run workflow)
# with a tag to retry a release.
name: Add a released map to the list

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, like got-world-v1"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: basemaps-list
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^[a-z0-9][a-z0-9-]{0,63}-v[1-9][0-9]{0,5}$ ]]; then
            echo "::error::The release tag \"$TAG\" must be <map-id>-v<version>, like got-world-v1."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Download the map
        run: |
          mkdir -p "$RUNNER_TEMP/map"
          gh release view "$TAG" --json name,body,author,assets > "$RUNNER_TEMP/release.json"
          gh release download "$TAG" --pattern "$TAG.pmtiles" --dir "$RUNNER_TEMP/map" || {
            echo "::error::The release has no file named $TAG.pmtiles. Attach the map under exactly that name, then run this workflow again."
            exit 1
          }

      - name: Check it and add it to the list
        id: add
        run: >
          node scripts/add-release.mjs
          --tag "$TAG"
          --file "$RUNNER_TEMP/map/$TAG.pmtiles"
          --release "$RUNNER_TEMP/release.json"
          --list basemaps.json
          --pr-body "$RUNNER_TEMP/pr-body.md"

      - name: Open a pull request
        if: steps.add.outputs.status == 'added'
        run: |
          branch="add-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add basemaps.json
          git commit -m "Add $TAG to the list"
          git push --force -u origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$branch" --title "Add $TAG to the list" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
