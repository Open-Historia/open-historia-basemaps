# Deletes a map (or one version of it) for good: its release, its file and its
# tag. The list keeps a tombstone (the date and reason, with no link), so the ID
# and version numbers are never reused and the game can tell players the map
# was removed. This can't be undone: to take a map down for now, archive it.
name: Delete a map permanently

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Map ID, like got-world"
        required: true
      version:
        description: "One version only (a number), or leave empty for the whole map"
        required: false
      reason:
        description: "Why (kept in the list, and posted on the submission issue)"
        required: true
      confirm:
        description: "Type the map ID again (or <id>-v<version> for one version) to confirm. This can't be undone."
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: basemaps-list
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAP_ID: ${{ inputs.id }}
      MAP_VERSION: ${{ inputs.version }}
      REASON: ${{ inputs.reason }}
      CONFIRM: ${{ inputs.confirm }}
      ACTOR: ${{ github.actor }}
    steps:
      - name: Only maintainers, and only when confirmed
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$permission" in admin|maintain|write) ;; *) echo "::error::Only maintainers can delete maps."; exit 1 ;; esac
          expected="$MAP_ID${MAP_VERSION:+-v$MAP_VERSION}"
          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::To confirm, type exactly \"$expected\". Nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Change the list
        id: list
        run: node scripts/manage-map.mjs delete --id "$MAP_ID" --version "$MAP_VERSION" --reason "$REASON"

      - name: Delete the releases, their files and tags
        env:
          TAGS: ${{ steps.list.outputs.tags }}
        run: |
          for tag in $TAGS; do
            gh release delete "$tag" --yes --cleanup-tag || echo "No release $tag to delete (already gone)."
          done

      - name: Commit, and tell the submitter
        env:
          TAGS: ${{ steps.list.outputs.tags }}
        run: |
          what="$MAP_ID${MAP_VERSION:+ version $MAP_VERSION}"
          bash scripts/finish-change.sh "Delete $what" "🗑️ **Deleted** by @$ACTOR: $what was removed permanently. Players who already have it keep their copy; nobody else can download it. Reason: ${REASON}" $TAGS
